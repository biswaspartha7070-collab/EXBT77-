<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EXBT77 Play</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #090a0f;
  --line: rgba(255,255,255,.075);
  --text: #f7f6fb;
  --muted: #9293a2;
  --purple: #a88aff;
  --purple-bright: #b69bff;
  --green: #5de2a2;
  --gold: #ffb84d;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: calc(var(--safe-top) + 12px) 0 calc(108px + var(--safe-bottom));
  overflow-x: hidden;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% -20%, rgba(121,83,207,.17), transparent 48%),
    linear-gradient(180deg, #0c0d13 0%, var(--bg) 52%);
  font-family: 'DM Sans', Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  touch-action: manipulation;
}

button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; -webkit-user-drag: none; }

/* HEADER */
.header {
  position: sticky;
  top: var(--safe-top);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(100%, 760px);
  height: 66px;
  margin: 0 auto;
  padding: 0 20px;
  background: rgba(10,11,16,.76);
  border-bottom: 1px solid rgba(255,255,255,.055);
  backdrop-filter: saturate(150%) blur(22px);
  -webkit-backdrop-filter: saturate(150%) blur(22px);
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-logo {
  display: grid; place-items: center;
  width: 40px; height: 40px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 14px;
  background: linear-gradient(145deg, #a17aff 0%, #7042e6 80%);
  box-shadow: 0 7px 22px rgba(119,78,239,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.brand-logo svg { width: 23px; height: 23px; stroke: #fff; }
.brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.25px; }

.notification-btn {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border: 1px solid var(--line);
  border-radius: 15px;
  color: #e0deea;
  background: rgba(255,255,255,.045);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.notification-btn:active { transform: scale(.92); background: rgba(255,255,255,.1); }
.notification-btn svg { width: 21px; height: 21px; stroke: currentColor; }

/* CONTAINER */
.container { width: min(100%, 540px); margin: 0 auto; padding: 22px 19px 30px; }
.hello { display: flex; flex-direction: column; gap: 5px; margin: 1px 2px 20px; }
.hello-small { color: var(--muted); font-size: 13px; font-weight: 500; }
.hello-name { font-size: clamp(25px, 7vw, 30px); line-height: 1.14; font-weight: 750; letter-spacing: -.9px; }

/* =========================================================
   HERO BANNER — Lucky Spin
   ========================================================= */
.hero-banner {
  position: relative;
  width: 100%;
  height: 210px;
  overflow: hidden;
  border-radius: 27px;
  border: 1px solid rgba(168,138,255,.35);
  background:
    radial-gradient(circle at 88% 12%, rgba(168,138,255,.42), transparent 58%),
    radial-gradient(circle at 8% 105%, rgba(255,184,77,.22), transparent 55%),
    linear-gradient(135deg, #2d1f52 0%, #1a1530 55%, #12101d 100%);
  box-shadow:
    0 22px 55px rgba(119,78,239,.35),
    0 0 0 1px rgba(255,255,255,.04) inset,
    inset 0 1px 0 rgba(255,255,255,.1);
  cursor: pointer;
  transition: transform .2s ease;
  margin-bottom: 16px;
  isolation: isolate;
  will-change: transform;
  contain: layout style paint;
  display: block;
}
.hero-banner:active { transform: scale(.985); }

/* decorative spinning wheel */
.hero-banner::before {
  content: "";
  position: absolute;
  top: -70px;
  right: -70px;
  width: 290px;
  height: 290px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #a17aff 0deg, #7042e6 45deg,
    #a17aff 90deg, #7042e6 135deg,
    #a17aff 180deg, #7042e6 225deg,
    #a17aff 270deg, #7042e6 315deg,
    #a17aff 360deg
  );
  opacity: .45;
  animation: heroRingSpin 16s linear infinite;
  pointer-events: none;
  z-index: 1;
  filter: blur(.3px);
}
.hero-banner::after {
  content: "";
  position: absolute;
  top: -40px;
  right: -40px;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  background: linear-gradient(145deg, #1a1530, #12101d);
  border: 2px solid rgba(168,138,255,.5);
  box-shadow:
    inset 0 0 60px rgba(0,0,0,.65),
    0 0 60px rgba(168,138,255,.25);
  pointer-events: none;
  z-index: 2;
}
@keyframes heroRingSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.hero-badge {
  position: absolute;
  top: 18px;
  left: 22px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 99px;
  background: linear-gradient(135deg, #ffb84d, #ff7a3d);
  color: #241400;
  font-size: 10.5px;
  font-weight: 900;
  letter-spacing: .7px;
  text-transform: uppercase;
  box-shadow:
    0 8px 22px rgba(255,140,26,.55),
    inset 0 1px 0 rgba(255,255,255,.4);
  z-index: 5;
}
.hero-badge svg {
  width: 11px; height: 11px;
  fill: currentColor;
  animation: badgePulse 1.4s ease-in-out infinite;
}
@keyframes badgePulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: .85; }
}

.hero-overlay {
  position: absolute;
  inset: 0;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,.82) 100%);
  z-index: 4;
}

.hero-info { margin-bottom: 15px; position: relative; z-index: 5; }
.hero-name {
  color: #fff;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.8px;
  margin-bottom: 6px;
  text-shadow: 0 3px 16px rgba(0,0,0,.75);
  background: linear-gradient(135deg, #fff 0%, #e6d5ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}
.hero-sub {
  color: rgba(255,255,255,.88);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -.1px;
}

.hero-play {
  align-self: flex-start;
  height: 48px;
  padding: 0 26px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #a17aff, #7042e6);
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .4px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  box-shadow:
    0 12px 30px rgba(119,78,239,.65),
    inset 0 1px 0 rgba(255,255,255,.3);
  position: relative;
  z-index: 5;
  transition: transform .16s ease;
}
.hero-play:active { transform: scale(.95); }
.hero-play svg { width: 16px; height: 16px; fill: #fff; }

/* BALANCE */
.balance-card {
  position: relative;
  isolation: isolate;
  min-height: 184px;
  overflow: hidden;
  padding: 22px 22px 21px;
  border: 1px solid rgba(176,145,255,.25);
  border-radius: 27px;
  background:
    radial-gradient(ellipse at 92% 10%, rgba(168,131,255,.28), transparent 37%),
    radial-gradient(ellipse at 5% 115%, rgba(102,62,187,.17), transparent 48%),
    linear-gradient(135deg, #211a36 0%, #151522 57%, #11121a 100%);
  box-shadow: 0 18px 46px rgba(0,0,0,.27), inset 0 1px 0 rgba(255,255,255,.065);
}
.balance-card::before, .balance-card::after {
  content: ''; position: absolute; z-index: -1;
  border: 1px solid rgba(196,170,255,.105);
  border-radius: 50%; pointer-events: none;
}
.balance-card::before { width: 220px; height: 220px; right: -88px; bottom: -147px; }
.balance-card::after { width: 168px; height: 168px; right: -62px; bottom: -120px; }
.balance-label { position: relative; color: #c0b9d1; font-size: 13px; font-weight: 550; margin-bottom: 14px; }
.balance { position: relative; display: flex; align-items: baseline; font-size: clamp(34px, 9vw, 42px); line-height: 1; font-weight: 800; letter-spacing: -1.5px; }
.balance-symbol { margin-right: 4px; color: #c3aaff; font-size: .7em; font-weight: 650; }
.balance-note { position: relative; margin-top: 13px; color: #a5a0b3; font-size: 12px; }

@keyframes balanceFlash {
  0% { color: var(--purple-bright); }
  30% { color: var(--green); transform: scale(1.06); }
  100% { color: inherit; transform: scale(1); }
}
.balance-flash { animation: balanceFlash .9s ease; }

/* ACTIONS */
.actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 14px; }
.action-card {
  display: flex; align-items: center; gap: 12px;
  min-width: 0; min-height: 92px; padding: 14px;
  border: 1px solid var(--line); border-radius: 21px;
  text-align: left; cursor: pointer;
  transition: transform .16s ease, filter .16s ease;
}
.action-card:active { transform: scale(.975); filter: brightness(1.16); }
.deposit-action { border-color: rgba(75,220,151,.16); background: linear-gradient(145deg, rgba(37,169,108,.13), rgba(17,31,27,.86)); }
.withdraw-action { border-color: rgba(158,119,255,.17); background: linear-gradient(145deg, rgba(130,88,237,.15), rgba(30,23,47,.9)); }
.action-icon { display: grid; place-items: center; width: 46px; height: 46px; flex: 0 0 46px; border-radius: 15px; }
.deposit-action .action-icon { color: var(--green); background: rgba(57,207,133,.12); }
.withdraw-action .action-icon { color: #b99aff; background: rgba(148,101,255,.13); }
.action-icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.9; }
.action-title { margin-bottom: 4px; font-size: 14px; font-weight: 700; }
.action-subtitle { color: #999aa8; font-size: 10.5px; line-height: 1.35; }

/* SECTION */
.section { margin-top: 27px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 13px; }
.section-title { font-size: 18px; font-weight: 730; letter-spacing: -.35px; }

/* FEATURED */
.featured-stack { display: flex; flex-direction: column; gap: 14px; }
.featured-banner {
  position: relative;
  width: 100%; height: 190px;
  overflow: hidden;
  border-radius: 23px;
  border: 1px solid rgba(255,255,255,.075);
  background: linear-gradient(120deg, #211a32 0%, #161621 65%, #12141b 100%);
  cursor: pointer;
  transition: transform .16s ease;
  animation: bannerFade .5s ease backwards;
  box-shadow: 0 12px 32px rgba(0,0,0,.25);
  will-change: transform;
  contain: layout style paint;
}
@keyframes bannerFade { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.featured-banner:active { transform: scale(.985); }
.featured-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }

.featured-overlay {
  position: absolute;
  inset: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.85) 100%);
}
.featured-info { margin-bottom: 14px; }
.featured-game-name {
  color: #fff; font-size: 20px; font-weight: 800;
  letter-spacing: -.5px; margin-bottom: 5px;
  text-shadow: 0 2px 12px rgba(0,0,0,.7);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.featured-game-sub { color: rgba(255,255,255,.85); font-size: 12px; font-weight: 500; }

.featured-play {
  align-self: flex-start;
  height: 42px; padding: 0 22px;
  border: 0; border-radius: 13px;
  background: linear-gradient(135deg, #a17aff, #7042e6);
  color: #fff; font-size: 13px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(119,78,239,.55);
}
.featured-play:active { transform: scale(.95); }
.featured-play svg { width: 14px; height: 14px; fill: #fff; }

.featured-empty {
  width: 100%; padding: 40px 20px;
  border: 1px dashed rgba(255,255,255,.12);
  border-radius: 23px;
  background: rgba(255,255,255,.02);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px;
  color: #c5b7e6;
}
.featured-empty svg { width: 36px; height: 36px; stroke: #b197eb; opacity: .8; }
.featured-empty span { font-size: 13px; font-weight: 550; text-align: center; }

.banner-skeleton {
  width: 100%; height: 190px;
  border-radius: 23px;
  background: linear-gradient(90deg, #1a1c26 20%, #242736 40%, #1a1c26 60%);
  background-size: 300% 100%;
  animation: bannerShimmer 1.4s infinite;
}
@keyframes bannerShimmer { 0%{background-position:100% 0;} 100%{background-position:-100% 0;} }

/* TASK CARD */
.task-card-single {
  display: flex; align-items: center; gap: 14px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 21px;
  background: linear-gradient(145deg, rgba(25,27,37,.98), rgba(16,17,24,.98));
  cursor: pointer;
  transition: transform .16s ease;
}
.task-card-single:active { transform: scale(.98); }
.task-card-icon {
  display: grid; place-items: center;
  width: 52px; height: 52px;
  border: 1px solid rgba(176,145,255,.11);
  border-radius: 16px;
  background: linear-gradient(145deg, rgba(147,104,242,.16), rgba(255,255,255,.035));
  flex-shrink: 0;
}
.task-card-icon svg { width: 24px; height: 24px; color: #b49aff; stroke: currentColor; }
.task-card-info { flex: 1; min-width: 0; }
.task-card-title { font-size: 15px; font-weight: 750; letter-spacing: -.2px; margin-bottom: 5px; }
.task-card-sub { color: #999aa8; font-size: 11.5px; line-height: 1.4; }
.task-card-arrow { color: #666a77; flex-shrink: 0; }
.task-card-arrow svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; z-index: 100;
  left: 50%; bottom: calc(10px + var(--safe-bottom));
  display: flex; align-items: center; justify-content: space-around;
  width: min(calc(100% - 20px), 520px); min-height: 74px;
  padding: 5px 5px calc(5px + var(--safe-bottom));
  transform: translateX(-50%);
  border: 1px solid rgba(255,255,255,.105); border-radius: 24px;
  background: rgba(21,22,30,.9);
  box-shadow: 0 15px 42px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter: saturate(160%) blur(25px);
  -webkit-backdrop-filter: saturate(160%) blur(25px);
}
.nav-item {
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
  width: 25%; min-width: 0; min-height: 60px; padding: 3px 0;
  border-radius: 17px; color: #9293a1;
  font-size: 10px; font-weight: 550;
  cursor: pointer; touch-action: manipulation;
  transition: color .16s ease, background .16s ease;
}
.nav-item:active { background: rgba(255,255,255,.055); }
.nav-icon { display: grid; place-items: center; width: 31px; height: 29px; border-radius: 11px; }
.nav-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; }
.nav-item.active { color: #c1a8ff; font-weight: 650; }
.nav-item.active .nav-icon { background: rgba(164,126,255,.13); }

.toast {
  position: fixed; z-index: 200;
  left: 50%; bottom: calc(100px + var(--safe-bottom));
  max-width: calc(100vw - 36px); padding: 12px 16px;
  transform: translate(-50%, 12px);
  border: 1px solid var(--line); border-radius: 15px;
  color: var(--text); background: rgba(31,32,42,.96);
  font-size: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 380px) {
  .header { padding-inline: 15px; }
  .container { padding-inline: 14px; }
  .actions { gap: 9px; }
  .action-card { gap: 9px; padding: 11px; }
  .action-icon { width: 41px; height: 41px; flex-basis: 41px; }
  .action-title { font-size: 13px; }
  .featured-banner { height: 165px; }
  .featured-game-name { font-size: 17px; }
  .featured-play { height: 38px; padding: 0 18px; font-size: 12px; }
  .bottom-nav { width: calc(100% - 14px); }
  .hero-banner { height: 185px; }
  .hero-name { font-size: 22px; }
  .hero-play { height: 44px; padding: 0 22px; font-size: 13px; }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M7 4h10l3 5-8 11L4 9l3-5z" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M4 9h16M7 4l5 5 5-5" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">EXBT77 Play</div>
  </div>

  <button class="notification-btn" onclick="location.href='notifications.html'">
    <svg fill="none" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M10 21h4" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
</header>


<main class="container">

  <section class="hello">
    <div class="hello-small">Welcome back</div>
    <div class="hello-name" id="userName">User</div>
  </section>

  <!-- =========================================================
       HERO BANNER — Lucky Spin
       সরাসরি home.html-এ hardcoded, সবচেয়ে উপরে prominent
       Click → lucky-spin.html
       ========================================================= -->
  <a class="hero-banner" href="lucky-spin.html" aria-label="Play Lucky Spin">
    <div class="hero-badge">
      <svg viewBox="0 0 24 24"><path d="M13 2L4.5 12.5H11L9.5 22 19 11.5H12.5L13 2z"/></svg>
      HOT
    </div>

    <div class="hero-overlay">
      <div class="hero-info">
        <div class="hero-name">Lucky Spin</div>
        <div class="hero-sub">Spin the wheel & win up to ৳30</div>
      </div>
      <div class="hero-play">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Play Now
      </div>
    </div>
  </a>
  <!-- ========================================================= -->


  <section class="balance-card">
    <div class="balance-label">Available Balance</div>
    <div class="balance">
      <span class="balance-symbol">৳</span>
      <span id="balance">0.00</span>
    </div>
    <div class="balance-note">Your current available balance</div>
  </section>

  <section class="actions">
    <button class="action-card deposit-action" onclick="location.href='deposit.html'">
      <div class="action-icon">
        <svg fill="none" viewBox="0 0 24 24">
          <path d="M12 20V4" stroke-linecap="round"/>
          <path d="M7 9l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 20h14" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="action-title">Deposit</div>
        <div class="action-subtitle">Add funds to your wallet</div>
      </div>
    </button>

    <button class="action-card withdraw-action" onclick="location.href='withdraw.html'">
      <div class="action-icon">
        <svg fill="none" viewBox="0 0 24 24">
          <path d="M12 4v16" stroke-linecap="round"/>
          <path d="M7 15l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 4h14" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="action-title">Withdraw</div>
        <div class="action-subtitle">Request a withdrawal</div>
      </div>
    </button>
  </section>

  <section class="section">
    <div class="section-header">
      <div class="section-title">Featured</div>
    </div>
    <div class="featured-stack" id="featuredStack">
      <div class="banner-skeleton"></div>
      <div class="banner-skeleton"></div>
    </div>
  </section>

  <section class="section">
    <div class="section-header">
      <div class="section-title">Tasks</div>
    </div>

    <a class="task-card-single" href="tasks.html">
      <div class="task-card-icon">
        <svg fill="none" viewBox="0 0 24 24">
          <rect x="5" y="3" width="14" height="18" rx="2" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M8 8h8M8 12h8M8 16h4" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="task-card-info">
        <div class="task-card-title">Complete Tasks</div>

<script type="module">

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getDatabase, ref, get, onValue
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVuTqUM2jaawhWRzxWiK9cwUUxlH_LyB8",
  authDomain: "exbt77-play.firebaseapp.com",
  databaseURL: "https://exbt77-play-default-rtdb.firebaseio.com",
  projectId: "exbt77-play",
  storageBucket: "exbt77-play.firebasestorage.app",
  messagingSenderId: "150332377686",
  appId: "1:150332377686:web:9dbd97caecb7484a8089f7"
};

const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
const auth = getAuth(app);
const db = getDatabase(app);

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));


/* =========================================================
   LOOP PROTECTION HELPERS
   ========================================================= */
const REDIRECT_KEY = "__last_redirect__";
const REDIRECT_WINDOW = 3000;

function isRedirectLoop(){
  try{
    const last = sessionStorage.getItem(REDIRECT_KEY);
    if(!last) return false;
    return (Date.now() - Number(last)) < REDIRECT_WINDOW;
  }catch(e){ return false; }
}

function markRedirect(){
  try{ sessionStorage.setItem(REDIRECT_KEY, String(Date.now())); }catch(e){}
}


function escapeHTML(v){
  if(v === undefined || v === null) return "";
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(v){
  return Number(v || 0).toLocaleString("en-US",{
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__t);
  window.__t = setTimeout(() => el.classList.remove("show"), 2600);
}


/* =========================================================
   BALANCE SYNC
   ========================================================= */
let balanceRef = null;
let currentBalance = null;
let flashTimer = null;

function setBalance(val, animate = false){
  const num = Number(val || 0);
  const el = document.getElementById("balance");
  const formatted = money(num);

  const changed = currentBalance !== null && currentBalance !== num;
  currentBalance = num;
  el.textContent = formatted;

  if(animate && changed){
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      el.classList.remove("balance-flash");
      void el.offsetWidth;
      el.classList.add("balance-flash");
    }, 30);
  }
}

function attachBalanceListener(uid){
  if(balanceRef) return;
  balanceRef = ref(db, "users/" + uid + "/balance");
  onValue(balanceRef, (snap) => {
    const val = snap.exists() ? snap.val() : 0;
    setBalance(val, true);
  }, (err) => {
    console.error("Balance listener error:", err);
  });
}


/* =========================================================
   AUTH + BALANCE
   ========================================================= */
onAuthStateChanged(auth, async (user) => {

  if(!user){

    await new Promise(r => setTimeout(r, 800));

    if(auth.currentUser) return;

    if(isRedirectLoop()){
      console.warn("Home redirect loop detected — stopping.");
      return;
    }

    markRedirect();
    location.replace("login.html");
    return;
  }

  const nameEl = document.getElementById("userName");
  const displayName =
    user.displayName ||
    (user.email ? user.email.split("@")[0] : "") ||
    "User";
  nameEl.textContent = displayName;

  try{
    const snap = await get(ref(db, "users/" + user.uid));
    const data = snap.val() || {};
    setBalance(data.balance, false);
  }catch(err){
    console.error("Balance error:", err);
  }

  attachBalanceListener(user.uid);

});


document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState !== "visible") return;
  const user = auth.currentUser;
  if(!user) return;
  try{
    const snap = await get(ref(db, "users/" + user.uid + "/balance"));
    const val = snap.exists() ? snap.val() : 0;
    setBalance(val, true);
  }catch(err){
    console.error("Visibility refresh error:", err);
  }
});


/* =========================================================
   BANNER CACHE
   ========================================================= */
const BANNER_CACHE_KEY = "__banners_cache__";
const BANNER_CACHE_TTL = 5 * 60 * 1000;

function readBannerCache(){
  try{
    const raw = sessionStorage.getItem(BANNER_CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || !obj.t || (Date.now() - obj.t) > BANNER_CACHE_TTL) return null;
    return obj.d || null;
  }catch(e){ return null; }
}

function writeBannerCache(data){
  try{
    sessionStorage.setItem(BANNER_CACHE_KEY, JSON.stringify({
      t: Date.now(),
      d: data
    }));
  }catch(e){}
}


/* =========================================================
   LOAD FEATURED BANNERS
   ========================================================= */
async function loadFeaturedBanners(){

  const container = document.getElementById("featuredStack");

  const cached = readBannerCache();
  if(cached && cached.length > 0){
    renderBanners(container, cached, false);
  }

  try{

    const snap = await get(ref(db, "banners"));

    if(!snap.exists()){
      if(!cached) showEmpty(container);
      return;
    }

    const banners = [];

    snap.forEach(child => {
      const data = child.val() || {};
      if(data.image && data.gameSlug){
        banners.push({ id: child.key, ...data });
      }
    });

    if(banners.length === 0){
      if(!cached) showEmpty(container);
      return;
    }

    banners.sort((a,b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

    writeBannerCache(banners);

    if(!cached || JSON.stringify(cached) !== JSON.stringify(banners)){
      renderBanners(container, banners, true);
    }

  }catch(err){
    console.error("Banner load error:", err);
    if(!cached) showEmpty(container);
  }

}


function renderBanners(container, banners, animate){

  const frag = document.createDocumentFragment();

  banners.forEach((banner, idx) => {

    const card = document.createElement("div");
    card.className = "featured-banner";

    if(animate){
      card.style.animationDelay = (idx * 60) + "ms";
    }else{
      card.style.animation = "none";
    }

    const sub = banner.gameSub
      ? escapeHTML(banner.gameSub)
      : "Tap to play and win";

    card.innerHTML = `
      <img src="${escapeHTML(banner.image)}"
           alt="${escapeHTML(banner.gameName || 'Banner')}"
           loading="${idx < 2 ? 'eager' : 'lazy'}"
           decoding="async"
           onerror="this.style.display='none'">
      <div class="featured-overlay">
        <div class="featured-info">
          <div class="featured-game-name">${escapeHTML(banner.gameName || 'Play Now')}</div>
          <div class="featured-game-sub">${sub}</div>
        </div>
        <button class="featured-play" type="button">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Play Now
        </button>
      </div>
    `;

    card.addEventListener("click", (e) => {
      if(e.target.closest(".featured-play")) return;
      goToGame(banner);
    });

    const playBtn = card.querySelector(".featured-play");
    if(playBtn){
      playBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        goToGame(banner);
      });
    }

    frag.appendChild(card);
  });

  container.replaceChildren(frag);
}


function showEmpty(container){
  container.innerHTML = `
    <div class="featured-empty">
      <svg fill="none" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" stroke-width="1.6"/>
        <path d="M3 16l5-5 4 4 3-3 6 5" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="8" cy="9" r="1.3" stroke-width="1.5"/>
      </svg>
      <span>No featured banners yet</span>
    </div>
  `;
}


function goToGame(banner){
  if(!banner) return;

  if(banner.gameUrl){
    location.href = banner.gameUrl;
    return;
  }

  if(banner.gameSlug){
    location.href = banner.gameSlug + ".html";
    return;
  }

  toast("Game link not configured");
}


loadFeaturedBanners();

</script>

</body>
