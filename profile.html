<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d13">
<title>Profile • EXBT77 Play</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme: dark;
  --bg: #090a0f;
  --surface: #11131b;
  --line: rgba(255,255,255,.075);
  --text: #f7f6fb;
  --muted: #9293a2;
  --purple: #a88aff;
  --purple-bright: #b69bff;
  --green: #5de2a2;
  --red: #ff6262;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: calc(var(--safe-top) + 12px) 0 calc(108px + var(--safe-bottom));
  overflow-x: hidden;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% -20%, rgba(121,83,207,.17), transparent 48%),
    linear-gradient(180deg, #0c0d13 0%, var(--bg) 52%);
  font-family: 'DM Sans', Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  touch-action: manipulation;
}

button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; -webkit-user-drag: none; }

/* HEADER */
.header {
  position: sticky;
  top: var(--safe-top);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(100%, 760px);
  height: 66px;
  margin: 0 auto;
  padding: 0 20px;
  background: rgba(10,11,16,.76);
  border-bottom: 1px solid rgba(255,255,255,.055);
  backdrop-filter: saturate(150%) blur(22px);
  -webkit-backdrop-filter: saturate(150%) blur(22px);
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-logo {
  display: grid; place-items: center;
  width: 40px; height: 40px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 14px;
  background: linear-gradient(145deg, #a17aff 0%, #7042e6 80%);
  box-shadow: 0 7px 22px rgba(119,78,239,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.brand-logo svg { width: 23px; height: 23px; stroke: #fff; }
.brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.25px; }

.notification-btn {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border: 1px solid var(--line);
  border-radius: 15px;
  color: #e0deea;
  background: rgba(255,255,255,.045);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.notification-btn:active { transform: scale(.92); background: rgba(255,255,255,.1); }
.notification-btn svg { width: 21px; height: 21px; stroke: currentColor; }

/* CONTAINER */
.container { width: min(100%, 540px); margin: 0 auto; padding: 22px 19px 30px; }

/* PROFILE CARD */
.profile-card {
  padding: 28px 22px;
  border-radius: 27px;
  background:
    radial-gradient(ellipse at 92% 10%, rgba(168,131,255,.20), transparent 40%),
    linear-gradient(135deg, #211a36 0%, #151522 57%, #11121a 100%);
  border: 1px solid rgba(176,145,255,.25);
  box-shadow: 0 18px 46px rgba(0,0,0,.27);
  margin-bottom: 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.profile-card::after {
  content: '';
  position: absolute;
  width: 220px; height: 220px;
  border-radius: 50%;
  right: -90px; bottom: -110px;
  border: 1px solid rgba(160,120,255,.15);
  pointer-events: none;
}

.profile-avatar {
  width: 90px; height: 90px;
  margin: 0 auto 16px;
  border-radius: 28px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #a17aff, #7042e6);
  color: #fff;
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -1px;
  box-shadow: 0 12px 32px rgba(139,92,246,.4);
  position: relative;
  z-index: 2;
}

.profile-name {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.4px;
  margin-bottom: 6px;
  position: relative;
  z-index: 2;
}

.profile-email {
  color: var(--purple-bright);
  font-size: 13px;
  font-weight: 600;
  word-break: break-all;
  margin-bottom: 14px;
  position: relative;
  z-index: 2;
}

.profile-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(93,226,162,.10);
  border: 1px solid rgba(93,226,162,.20);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  position: relative;
  z-index: 2;
}

.profile-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 10px var(--green);
}

/* SECTION */
.section { margin-top: 22px; }
.section-header { margin: 0 2px 13px; }
.section-title {
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
}

/* MENU */
.menu {
  background: linear-gradient(145deg, rgba(25,27,37,.98), rgba(16,17,24,.98));
  border: 1px solid var(--line);
  border-radius: 21px;
  overflow: hidden;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  transition: background .16s ease;
  cursor: pointer;
  text-align: left;
  width: 100%;
  background: transparent;
  border-left: 0;
  border-right: 0;
  border-top: 0;
  color: #fff;
  font-family: inherit;
}
.menu-item:last-child { border-bottom: 0; }
.menu-item:active { background: rgba(255,255,255,.025); }

.menu-icon {
  width: 40px; height: 40px;
  border-radius: 13px;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.menu-icon svg {
  width: 19px; height: 19px;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.menu-icon.copy { background: rgba(168,138,255,.10); }
.menu-icon.copy svg { stroke: var(--purple); }
.menu-icon.history { background: rgba(123,166,255,.10); }
.menu-icon.history svg { stroke: #7ba6ff; }
.menu-icon.privacy { background: rgba(232,184,77,.10); }
.menu-icon.privacy svg { stroke: #e8b84d; }
.menu-icon.logout { background: rgba(255,98,98,.10); }
.menu-icon.logout svg { stroke: var(--red); }

.menu-info { flex: 1; min-width: 0; }
.menu-title {
  font-size: 14px;
  font-weight: 750;
  letter-spacing: -.2px;
  margin-bottom: 4px;
  color: #fff;
}
.menu-sub {
  color: var(--muted);
  font-size: 11px;
  word-break: break-all;
}
.menu-item.logout .menu-title { color: var(--red); }

.menu-arrow {
  color: #666a77;
  flex-shrink: 0;
}
.menu-arrow svg {
  width: 18px; height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
.spinner {
  width: 34px; height: 34px;
  margin: 0 auto 14px;
  border: 3px solid rgba(139,92,246,.15);
  border-top-color: #8b5cf6;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; z-index: 100;
  left: 50%; bottom: calc(10px + var(--safe-bottom));
  display: flex; align-items: center; justify-content: space-around;
  width: min(calc(100% - 20px), 520px); min-height: 74px;
  padding: 5px 5px calc(5px + var(--safe-bottom));
  transform: translateX(-50%);
  border: 1px solid rgba(255,255,255,.105); border-radius: 24px;
  background: rgba(21,22,30,.9);
  box-shadow: 0 15px 42px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter: saturate(160%) blur(25px);
  -webkit-backdrop-filter: saturate(160%) blur(25px);
}
.nav-item {
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
  width: 25%; min-width: 0; min-height: 60px; padding: 3px 0;
  border-radius: 17px; color: #9293a1;
  font-size: 10px; font-weight: 550;
  cursor: pointer; touch-action: manipulation;
  transition: color .16s ease, background .16s ease;
}
.nav-item:active { background: rgba(255,255,255,.055); }
.nav-icon { display: grid; place-items: center; width: 31px; height: 29px; border-radius: 11px; }
.nav-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; }
.nav-item.active { color: #c1a8ff; font-weight: 650; }
.nav-item.active .nav-icon { background: rgba(164,126,255,.13); }

/* TOAST */
.toast {
  position: fixed; z-index: 200;
  left: 50%; bottom: calc(100px + var(--safe-bottom));
  max-width: calc(100vw - 36px); padding: 12px 16px;
  transform: translate(-50%, 12px);
  border: 1px solid var(--line); border-radius: 15px;
  color: var(--text); background: rgba(31,32,42,.96);
  font-size: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 380px) {
  .header { padding-inline: 15px; }
  .container { padding-inline: 14px; }
  .profile-avatar { width: 80px; height: 80px; font-size: 32px; }
  .profile-name { font-size: 20px; }
  .menu-item { padding: 14px 15px; }
  .bottom-nav { width: calc(100% - 14px); }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M7 4h10l3 5-8 11L4 9l3-5z" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M4 9h16M7 4l5 5 5-5" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">EXBT77 Play</div>
  </div>

  <button class="notification-btn" onclick="location.href='notifications.html'">
    <svg fill="none" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M10 21h4" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
</header>


<main class="container">

  <!-- PROFILE CARD -->
  <section class="profile-card">

    <div class="profile-avatar" id="avatar">U</div>

    <div class="profile-name" id="userName">Loading...</div>

    <div class="profile-email" id="userEmail">Loading...</div>

    <div class="profile-status">
      <span class="dot"></span>
      Account Active
    </div>

  </section>

  <!-- ACCOUNT MENU -->
  <section class="section">
    <div class="section-header">
      <div class="section-title">Account</div>
    </div>

    <div class="menu">

      <button class="menu-item" onclick="copyUserId()">
        <div class="menu-icon copy">
          <svg viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
        </div>
        <div class="menu-info">
          <div class="menu-title">Account ID</div>
          <div class="menu-sub" id="userId">Loading...</div>
        </div>
        <div class="menu-arrow">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </button>

      <a class="menu-item" href="transactions.html">
        <div class="menu-icon history">
          <svg viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </div>
        <div class="menu-info">
          <div class="menu-title">Transaction History</div>
          <div class="menu-sub">View deposits and withdrawals</div>
        </div>
        <div class="menu-arrow">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </a>

    </div>
  </section>

  <!-- INFORMATION MENU -->
  <section class="section">
    <div class="section-header">
      <div class="section-title">Information</div>
    </div>

    <div class="menu">

      <button class="menu-item" onclick="showPrivacy()">
        <div class="menu-icon privacy">
          <svg viewBox="0 0 24 24">
            <path d="M12 3l8 3v5c0 5.2-3.3 8.7-8 10-4.7-1.3-8-4.8-8-10V6l8-3z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div class="menu-info">
          <div class="menu-title">Privacy Policy</div>
          <div class="menu-sub">Read our privacy information</div>
        </div>
        <div class="menu-arrow">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </button>

      <button class="menu-item logout" onclick="logoutUser()">
        <div class="menu-icon logout">
          <svg viewBox="0 0 24 24">
            <path d="M10 17l5-5-5-5"/>
            <path d="M15 12H3"/>
            <path d="M20 4v16"/>
          </svg>
        </div>
        <div class="menu-info">
          <div class="menu-title">Logout</div>
          <div class="menu-sub">Sign out from your account</div>
        </div>
        <div class="menu-arrow">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </button>

    </div>
  </section>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="home.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M3.5 10.5L12 3.5l8.5 7v8a1.5 1.5 0 0 1-1.5 1.5h-14a1.5 1.5 0 0 1-1.5-1.5v-8z" stroke-linejoin="round"/>
        <path d="M9 20v-6h6v6" stroke-linejoin="round"/>
      </svg>
    </div>
    Home
  </a>

  <a class="nav-item" href="transactions.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke-linejoin="round"/>
        <path d="M3 9h18" stroke-linecap="round"/>
        <path d="M8 14h4" stroke-linecap="round"/>
      </svg>
    </div>
    Activity
  </a>

  <a class="nav-item" href="wallet.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v11A2.5 2.5 0 0 1 18.5 21h-13A2.5 2.5 0 0 1 3 18.5v-11z" stroke-linejoin="round"/>
        <path d="M16 13h5" stroke-linecap="round"/>
        <circle cx="16.5" cy="14" r=".8" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    Wallet
  </a>

  <a class="nav-item active" href="profile.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" stroke-linejoin="round"/>
        <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6" stroke-linecap="round"/>
      </svg>
    </div>
    Profile
  </a>
</nav>


<div class="toast" id="toast"></div>


<script type="module">

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVuTqUM2jaawhWRzxWiK9cwUUxlH_LyB8",
  authDomain: "exbt77-play.firebaseapp.com",
  databaseURL: "https://exbt77-play-default-rtdb.firebaseio.com",
  projectId: "exbt77-play",
  storageBucket: "exbt77-play.firebasestorage.app",
  messagingSenderId: "150332377686",
  appId: "1:150332377686:web:9dbd97caecb7484a8089f7"
};

const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
const auth = getAuth(app);
const db = getDatabase(app);

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));


let currentUser = null;


function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__t);
  window.__t = setTimeout(() => el.classList.remove("show"), 2600);
}


/* COPY USER ID */
window.copyUserId = async function(){

  if(!currentUser) return;

  try{
    await navigator.clipboard.writeText(currentUser.uid);
    toast("Account ID copied");
  }catch(err){
    toast("Unable to copy");
  }

};


/* SHOW PRIVACY */
window.showPrivacy = function(){
  alert(
    "Privacy Policy\n\n" +
    "EXBT77 Play respects user account information. " +
    "Account information is used to provide app services " +
    "and manage your account.\n\n" +
    "Never share your password or authentication credentials with anyone."
  );
};


/* LOGOUT */
window.logoutUser = async function(){

  if(!confirm("Are you sure you want to logout?")) return;

  try{
    await signOut(auth);
    location.replace("login.html");
  }catch(err){
    console.error(err);
    toast("Logout failed");
  }

};


/* AUTH + LOAD USER */
onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.replace("login.html");
    return;
  }

  currentUser = user;

  /* Email */
  document.getElementById("userEmail").textContent =
    user.email || "No email";

  /* UID */
  document.getElementById("userId").textContent =
    user.uid;

  /* Default name */
  const fallbackName =
    user.displayName ||
    (user.email ? user.email.split("@")[0] : "") ||
    "User";

  document.getElementById("userName").textContent = fallbackName;
  document.getElementById("avatar").textContent = fallbackName.charAt(0).toUpperCase();

  /* Try to get custom name from database */
  try{
    const snap = await get(ref(db, "users/" + user.uid));

    if(snap.exists()){
      const data = snap.val() || {};
      const name = data.name || fallbackName;

      document.getElementById("userName").textContent = name;
      document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
    }
  }catch(err){
    console.error("Profile load error:", err);
  }

});

</script>

</body>
</html>
