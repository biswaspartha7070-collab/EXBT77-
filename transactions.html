<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d13">
<title>Transactions • EXBT77 Play</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme: dark;
  --bg: #090a0f;
  --surface: #11131b;
  --line: rgba(255,255,255,.075);
  --text: #f7f6fb;
  --muted: #9293a2;
  --purple: #a88aff;
  --purple-bright: #b69bff;
  --green: #5de2a2;
  --red: #ff6262;
  --yellow: #ffb84d;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  padding: calc(var(--safe-top) + 12px) 0 calc(108px + var(--safe-bottom));
  overflow-x: hidden;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% -20%, rgba(121,83,207,.17), transparent 48%),
    linear-gradient(180deg, #0c0d13 0%, var(--bg) 52%);
  font-family: 'DM Sans', Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
  touch-action: manipulation;
}

button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; -webkit-user-drag: none; }

/* HEADER */
.header {
  position: sticky;
  top: var(--safe-top);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(100%, 760px);
  height: 66px;
  margin: 0 auto;
  padding: 0 20px;
  background: rgba(10,11,16,.76);
  border-bottom: 1px solid rgba(255,255,255,.055);
  backdrop-filter: saturate(150%) blur(22px);
  -webkit-backdrop-filter: saturate(150%) blur(22px);
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-logo {
  display: grid; place-items: center;
  width: 40px; height: 40px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 14px;
  background: linear-gradient(145deg, #a17aff 0%, #7042e6 80%);
  box-shadow: 0 7px 22px rgba(119,78,239,.28), inset 0 1px 0 rgba(255,255,255,.2);
}
.brand-logo svg { width: 23px; height: 23px; stroke: #fff; }
.brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.25px; }

.notification-btn {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border: 1px solid var(--line);
  border-radius: 15px;
  color: #e0deea;
  background: rgba(255,255,255,.045);
  cursor: pointer;
  transition: transform .16s ease, background .16s ease;
}
.notification-btn:active { transform: scale(.92); background: rgba(255,255,255,.1); }
.notification-btn svg { width: 21px; height: 21px; stroke: currentColor; }

/* CONTAINER */
.container { width: min(100%, 540px); margin: 0 auto; padding: 22px 19px 30px; }

/* PAGE HEADER */
.page-head { margin-bottom: 20px; }
.page-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 6px; }
.page-head p { color: var(--muted); font-size: 12.5px; font-weight: 500; margin: 0; }

/* FILTERS */
.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 14px;
  scrollbar-width: none;
  margin-bottom: 6px;
}
.filters::-webkit-scrollbar { display: none; }

.filter {
  flex-shrink: 0;
  padding: 9px 16px;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,.08);
  background: #101219;
  color: #858895;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .16s;
  white-space: nowrap;
}
.filter:active { transform: scale(.96); }
.filter.active {
  background: linear-gradient(135deg, #a17aff, #7042e6);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 18px rgba(119,78,239,.4);
}
.filter .count {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 10px;
  background: rgba(255,255,255,.12);
  font-size: 10px;
  font-weight: 800;
}
.filter.active .count { background: rgba(255,255,255,.25); }

/* LIST */
.tx-list { display: flex; flex-direction: column; gap: 10px; }

.tx-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 18px;
  background: linear-gradient(145deg, rgba(25,27,37,.98), rgba(16,17,24,.98));
  border: 1px solid rgba(255,255,255,.07);
  cursor: pointer;
  transition: transform .16s ease, border-color .16s ease;
  animation: fadeInUp .35s ease backwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.tx-card:active { transform: scale(.985); border-color: rgba(171,137,255,.28); }

.tx-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.tx-icon svg { width: 20px; height: 20px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.tx-icon.deposit { background: rgba(93,226,162,.10); }
.tx-icon.deposit svg { stroke: var(--green); }
.tx-icon.withdrawal { background: rgba(168,138,255,.10); }
.tx-icon.withdrawal svg { stroke: var(--purple); }
.tx-icon.game { background: rgba(123,166,255,.10); }
.tx-icon.game svg { stroke: #7ba6ff; }

.tx-info { flex: 1; min-width: 0; }

.tx-title {
  font-size: 14px;
  font-weight: 750;
  letter-spacing: -.2px;
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tx-sub {
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.status-pill {
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.status-pill.pending {
  color: var(--yellow);
  background: rgba(255,184,77,.10);
  border: 1px solid rgba(255,184,77,.20);
}
.status-pill.approved,
.status-pill.completed {
  color: var(--green);
  background: rgba(93,226,162,.10);
  border: 1px solid rgba(93,226,162,.20);
}
.status-pill.rejected,
.status-pill.failed {
  color: var(--red);
  background: rgba(255,98,98,.10);
  border: 1px solid rgba(255,98,98,.20);
}

.tx-amount {
  font-size: 14.5px;
  font-weight: 850;
  letter-spacing: -.3px;
  white-space: nowrap;
  flex-shrink: 0;
}
.tx-amount.in { color: var(--green); }
.tx-amount.out { color: var(--purple); }

/* EMPTY / LOADING */
.empty {
  padding: 60px 20px;
  text-align: center;
  border: 1px dashed rgba(255,255,255,.12);
  border-radius: 20px;
  background: rgba(255,255,255,.02);
}
.empty-icon {
  width: 60px; height: 60px;
  margin: 0 auto 16px;
  border-radius: 20px;
  background: rgba(255,255,255,.045);
  display: grid; place-items: center;
}
.empty-icon svg { width: 28px; height: 28px; stroke: #5a6272; fill: none; stroke-width: 1.8; }
.empty-title { font-size: 15px; font-weight: 750; margin-bottom: 6px; color: #c4ccd8; }
.empty-sub { font-size: 12px; color: var(--muted); line-height: 1.5; }

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
.spinner {
  width: 34px; height: 34px;
  margin: 0 auto 14px;
  border: 3px solid rgba(139,92,246,.15);
  border-top-color: #8b5cf6;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; z-index: 100;
  left: 50%; bottom: calc(10px + var(--safe-bottom));
  display: flex; align-items: center; justify-content: space-around;
  width: min(calc(100% - 20px), 520px); min-height: 74px;
  padding: 5px 5px calc(5px + var(--safe-bottom));
  transform: translateX(-50%);
  border: 1px solid rgba(255,255,255,.105); border-radius: 24px;
  background: rgba(21,22,30,.9);
  box-shadow: 0 15px 42px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter: saturate(160%) blur(25px);
  -webkit-backdrop-filter: saturate(160%) blur(25px);
}
.nav-item {
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
  width: 25%; min-width: 0; min-height: 60px; padding: 3px 0;
  border-radius: 17px; color: #9293a1;
  font-size: 10px; font-weight: 550;
  cursor: pointer; touch-action: manipulation;
  transition: color .16s ease, background .16s ease;
}
.nav-item:active { background: rgba(255,255,255,.055); }
.nav-icon { display: grid; place-items: center; width: 31px; height: 29px; border-radius: 11px; }
.nav-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; }
.nav-item.active { color: #c1a8ff; font-weight: 650; }
.nav-item.active .nav-icon { background: rgba(164,126,255,.13); }

/* TOAST */
.toast {
  position: fixed; z-index: 200;
  left: 50%; bottom: calc(100px + var(--safe-bottom));
  max-width: calc(100vw - 36px); padding: 12px 16px;
  transform: translate(-50%, 12px);
  border: 1px solid var(--line); border-radius: 15px;
  color: var(--text); background: rgba(31,32,42,.96);
  font-size: 12px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

@media (max-width: 380px) {
  .header { padding-inline: 15px; }
  .container { padding-inline: 14px; }
  .page-head h1 { font-size: 21px; }
  .tx-card { padding: 13px; gap: 11px; }
  .tx-icon { width: 42px; height: 42px; }
  .tx-amount { font-size: 13.5px; }
  .bottom-nav { width: calc(100% - 14px); }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="brand-logo">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M7 4h10l3 5-8 11L4 9l3-5z" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M4 9h16M7 4l5 5 5-5" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">EXBT77 Play</div>
  </div>

  <button class="notification-btn" onclick="location.href='notifications.html'">
    <svg fill="none" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9z" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M10 21h4" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
</header>


<main class="container">

  <div class="page-head">
    <h1>Activity</h1>
    <p>All your transactions in one place</p>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter active" data-f="all" onclick="setFilter('all')">
      All <span class="count" id="cAll">0</span>
    </button>
    <button class="filter" data-f="deposit" onclick="setFilter('deposit')">
      Deposits <span class="count" id="cDep">0</span>
    </button>
    <button class="filter" data-f="withdrawal" onclick="setFilter('withdrawal')">
      Withdrawals <span class="count" id="cWd">0</span>
    </button>
    <button class="filter" data-f="game" onclick="setFilter('game')">
      Games <span class="count" id="cGame">0</span>
    </button>
  </div>

  <!-- LIST -->
  <div class="tx-list" id="txList">
    <div class="loading">
      <div class="spinner"></div>
      Loading transactions...
    </div>
  </div>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a class="nav-item" href="home.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M3.5 10.5L12 3.5l8.5 7v8a1.5 1.5 0 0 1-1.5 1.5h-14a1.5 1.5 0 0 1-1.5-1.5v-8z" stroke-linejoin="round"/>
        <path d="M9 20v-6h6v6" stroke-linejoin="round"/>
      </svg>
    </div>
    Home
  </a>

  <a class="nav-item active" href="transactions.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke-linejoin="round"/>
        <path d="M3 9h18" stroke-linecap="round"/>
        <path d="M8 14h4" stroke-linecap="round"/>
      </svg>
    </div>
    Activity
  </a>

  <a class="nav-item" href="wallet.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v11A2.5 2.5 0 0 1 18.5 21h-13A2.5 2.5 0 0 1 3 18.5v-11z" stroke-linejoin="round"/>
        <path d="M16 13h5" stroke-linecap="round"/>
        <circle cx="16.5" cy="14" r=".8" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    Wallet
  </a>

  <a class="nav-item" href="profile.html">
    <div class="nav-icon">
      <svg fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" stroke-linejoin="round"/>
        <path d="M4 21c.8-4 3.4-6 8-6s7.2 2 8 6" stroke-linecap="round"/>
      </svg>
    </div>
    Profile
  </a>
</nav>


<div class="toast" id="toast"></div>


<script type="module">

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVuTqUM2jaawhWRzxWiK9cwUUxlH_LyB8",
  authDomain: "exbt77-play.firebaseapp.com",
  databaseURL: "https://exbt77-play-default-rtdb.firebaseio.com",
  projectId: "exbt77-play",
  storageBucket: "exbt77-play.firebasestorage.app",
  messagingSenderId: "150332377686",
  appId: "1:150332377686:web:9dbd97caecb7484a8089f7"
};

const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
const auth = getAuth(app);
const db = getDatabase(app);

setPersistence(auth, browserLocalPersistence).catch(err => console.error(err));


let allTx = [];
let filteredTx = [];
let currentFilter = "all";
let currentUser = null;


function escapeHTML(v){
  if(v === undefined || v === null) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function money(v){
  return "৳" + Number(v || 0).toLocaleString("en-US",{
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function formatDate(ts){
  if(!ts) return "";
  const d = new Date(Number(ts));
  if(isNaN(d.getTime())) return "";
  return d.toLocaleString("en-US",{
    day:"2-digit", month:"short",
    hour:"2-digit", minute:"2-digit"
  });
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__t);
  window.__t = setTimeout(() => el.classList.remove("show"), 2600);
}


/* AUTH + LOAD */

onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.replace("login.html");
    return;
  }

  currentUser = user;

  await loadTransactions(user.uid);

});


/* LOAD TRANSACTIONS */

async function loadTransactions(uid){

  const list = document.getElementById("txList");

  try{

    const [depSnap, wdSnap, gameSnap] = await Promise.all([
      get(ref(db, "deposits")),
      get(ref(db, "withdrawals")),
      get(ref(db, "game-history"))
    ]);

    allTx = [];

    /* Deposits */
    if(depSnap.exists()){
      depSnap.forEach(c => {
        const d = c.val() || {};
        if(d.uid !== uid) return;
        allTx.push({
          id: c.key,
          type: "deposit",
          amount: Number(d.amount || 0),
          status: d.status || "pending",
          method: d.method || "Deposit",
          createdAt: Number(d.createdAt || 0)
        });
      });
    }

    /* Withdrawals */
    if(wdSnap.exists()){
      wdSnap.forEach(c => {
        const d = c.val() || {};
        if(d.uid !== uid) return;
        allTx.push({
          id: c.key,
          type: "withdrawal",
          amount: Number(d.amount || 0),
          status: d.status || "pending",
          method: d.method || "Withdrawal",
          createdAt: Number(d.createdAt || 0)
        });
      });
    }

    /* Game History */
    if(gameSnap.exists()){
      gameSnap.forEach(c => {
        const d = c.val() || {};
        if(d.uid !== uid) return;
        allTx.push({
          id: c.key,
          type: "game",
          amount: Number(d.entryFee || 0),
          status: d.status === "completed" ? "completed" : "pending",
          method: d.gameName || d.gameSlug || "Game",
          createdAt: Number(d.startedAt || d.completedAt || 0)
        });
      });
    }

    allTx.sort((a,b) => b.createdAt - a.createdAt);

    updateCounts();
    setFilter(currentFilter);

  }catch(err){
    console.error("Load error:", err);
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4M12 16h.01"/>
          </svg>
        </div>
        <div class="empty-title">Failed to Load</div>
        <div class="empty-sub">${escapeHTML(err.message || "Try again later")}</div>
      </div>
    `;
  }

}


/* UPDATE COUNTS */

function updateCounts(){
  document.getElementById("cAll").textContent = allTx.length;
  document.getElementById("cDep").textContent = allTx.filter(t => t.type === "deposit").length;
  document.getElementById("cWd").textContent = allTx.filter(t => t.type === "withdrawal").length;
  document.getElementById("cGame").textContent = allTx.filter(t => t.type === "game").length;
}


/* FILTER */

window.setFilter = function(f){

  currentFilter = f;

  document.querySelectorAll(".filter").forEach(b => {
    b.classList.toggle("active", b.dataset.f === f);
  });

  filteredTx = f === "all" ? [...allTx] : allTx.filter(t => t.type === f);

  renderTx();
};


/* RENDER */

function renderTx(){

  const list = document.getElementById("txList");

  if(filteredTx.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 9h18"/>
          </svg>
        </div>
        <div class="empty-title">No Transactions</div>
        <div class="empty-sub">Your activity will appear here</div>
      </div>
    `;
    return;
  }

  list.innerHTML = "";

  filteredTx.forEach((tx, idx) => {

    const card = document.createElement("div");
    card.className = "tx-card";
    card.style.animationDelay = (idx * 0.02) + "s";

    let iconClass = tx.type;
    let iconSvg = "";
    let amountClass = "";
    let amountPrefix = "";

    if(tx.type === "deposit"){
      amountClass = "in";
      amountPrefix = "+";
      iconSvg = `<path d="M12 4v16" stroke-linecap="round"/><path d="M7 9l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }else if(tx.type === "withdrawal"){
      amountClass = "out";
      amountPrefix = "-";
      iconSvg = `<path d="M12 20V4" stroke-linecap="round"/><path d="M7 15l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }else if(tx.type === "game"){
      amountClass = "out";
      amountPrefix = "-";
      iconSvg = `<rect x="3" y="6" width="18" height="12" rx="5"/><path d="M8 12h4M10 10v4" stroke-linecap="round"/>`;
    }

    card.innerHTML = `
      <div class="tx-icon ${iconClass}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${iconSvg}</svg>
      </div>

      <div class="tx-info">
        <div class="tx-title">${escapeHTML(tx.method)}</div>
        <div class="tx-sub">
          <span class="status-pill ${escapeHTML(tx.status)}">${escapeHTML(tx.status)}</span>
          <span>${formatDate(tx.createdAt)}</span>
        </div>
      </div>

      <div class="tx-amount ${amountClass}">
        ${amountPrefix}${money(tx.amount)}
      </div>
    `;

    list.appendChild(card);

  });

}

</script>

</body>
</html>
