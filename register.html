<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - EXBT77 Play</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b10;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:100%;
    max-width:430px;
    padding:25px;
}

.logo{
    width:65px;
    height:65px;
    border-radius:20px;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:bold;
    background:linear-gradient(135deg,#8155ff,#4c22d6);
}

h1{
    text-align:center;
    font-size:25px;
}

.sub{
    text-align:center;
    color:#7f8794;
    font-size:12px;
    margin:8px 0 28px;
}

label{
    display:block;
    color:#aeb4bf;
    font-size:11px;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid #ffffff0d;
    background:#12161e;
    color:white;
    outline:none;
}

input:focus{
    border-color:#7650ff;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#8055ff,#542bdc);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.65;
    cursor:default;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#858c98;
    font-size:12px;
}

.login a{
    color:#9879ff;
    text-decoration:none;
}

.error{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#ff3d3d18;
    color:#ff7777;
    font-size:11px;
    line-height:1.6;
}

.success{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#20d47a15;
    color:#52e69a;
    font-size:11px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">$</div>

    <h1>Create Account</h1>

    <div class="sub">
        Join EXBT77 Play
    </div>

    <form id="registerForm">

        <label>Full Name</label>

        <input
            id="name"
            type="text"
            required
            autocomplete="name"
            placeholder="Enter your name"
        >

        <label>Email</label>

        <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="Enter email"
        >

        <label>Password</label>

        <input
            id="password"
            type="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Minimum 6 characters"
        >

        <label>Confirm Password</label>

        <input
            id="confirmPassword"
            type="password"
            required
            minlength="6"
            autocomplete="new-password"
            placeholder="Confirm password"
        >

        <button id="registerButton" type="submit">
            CREATE ACCOUNT
        </button>

        <div class="error" id="error"></div>

        <div class="success" id="success">
            Account created successfully.
        </div>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script type="module">

/* ================================
   IMPORTS
================================ */

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* ================================
   FIREBASE CONFIGURATION
================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyCVuTqUM2jaawhWRzxWiK9cwUUxlH_LyB8",

    authDomain:
        "exbt77-play.firebaseapp.com",

    databaseURL:
        "https://exbt77-play-default-rtdb.firebaseio.com",

    projectId:
        "exbt77-play",

    storageBucket:
        "exbt77-play.firebasestorage.app",

    messagingSenderId:
        "150332377686",

    appId:
        "1:150332377686:web:9dbd97caecb7484a8089f7",

    measurementId:
        "G-SR45LCFH98"
};


/* ================================
   FIREBASE INITIALIZATION
   (single instance)
================================ */

const app =
    getApps().length === 0
        ? initializeApp(firebaseConfig)
        : getApp();

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* ================================
   PERSISTENCE
   (সেশন persist নিশ্চিত করে)
================================ */

setPersistence(auth, browserLocalPersistence)
    .catch(err =>
        console.error("Persistence error:", err)
    );


/* ================================
   AUTH STATE
   (লগইন থাকলে home.html-এ পাঠায়)
================================ */

onAuthStateChanged(auth, user => {

    if(user){

        location.replace("home.html");

    }

});


/* ================================
   REGISTER
================================ */

document
.getElementById("registerForm")
.addEventListener("submit", async e => {

    e.preventDefault();


    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    const button =
        document.getElementById("registerButton");


    error.style.display = "none";
    success.style.display = "none";


    /* NAME VALIDATION */

    if(name.length < 2){

        error.style.display = "block";

        error.textContent =
            "অনুগ্রহ করে আপনার সঠিক নাম লিখুন।";

        return;

    }


    /* PASSWORD MATCH */

    if(password !== confirmPassword){

        error.style.display = "block";

        error.textContent =
            "Password এবং Confirm Password মিলছে না।";

        return;

    }


    /* PASSWORD LENGTH */

    if(password.length < 6){

        error.style.display = "block";

        error.textContent =
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";

        return;

    }


    button.disabled = true;
    button.textContent = "CREATING...";


    try{

        /* CREATE FIREBASE AUTH ACCOUNT */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        /* SET DISPLAY NAME */

        try{

            await updateProfile(user, {
                displayName: name
            });

        }catch(profileErr){

            console.warn(
                "Could not set displayName:",
                profileErr
            );

        }


        /* UNIQUE REFERRAL CODE */

        const referralCode =
            "EXBT" +
            user.uid
            .substring(0,6)
            .toUpperCase();


        /* USER PROFILE */

        await set(
            ref(db, "users/" + user.uid),
            {

                uid: user.uid,

                name: name,

                email: user.email,

                balance: 0,

                totalDeposit: 0,

                totalWithdraw: 0,

                totalEarned: 0,

                referralCode: referralCode,

                createdAt: Date.now()

            }
        );


        success.style.display = "block";

        success.textContent =
            "Account created successfully. Redirecting...";


        setTimeout(() => {

            location.replace("home.html");

        }, 700);


    }catch(err){

        error.style.display = "block";


        /* EMAIL ALREADY EXISTS */

        if(
            err.code === "auth/email-already-in-use"
        ){

            error.textContent =
                "এই Email দিয়ে ইতিমধ্যেই একটি account আছে।";

        }


        /* INVALID EMAIL */

        else if(
            err.code === "auth/invalid-email"
        ){

            error.textContent =
                "দেওয়া Email address সঠিক নয়।";

        }


        /* WEAK PASSWORD */

        else if(
            err.code === "auth/weak-password"
        ){

            error.textContent =
                "Password আরও শক্তিশালী করুন। কমপক্ষে ৬ অক্ষর ব্যবহার করুন।";

        }


        /* API KEY ERROR */

        else if(
            err.code === "auth/api-key-not-valid" ||
            err.code === "auth/invalid-api-key"
        ){

            error.innerHTML = `
                <strong>Firebase Configuration Error</strong>
                <br><br>

                Firebase API Key গ্রহণ করছে না।

                <br><br>

                Error Code:
                ${err.code}
            `;

        }


        /* NETWORK */

        else if(
            err.code === "auth/network-request-failed"
        ){

            error.textContent =
                "Internet connection পরীক্ষা করে আবার চেষ্টা করুন।";

        }


        /* OTHER */

        else{

            error.innerHTML = `
                <strong>Registration Error</strong>
                <br><br>
                ${err.message}
                <br><br>
                <small>
                Error Code:
                ${err.code || "unknown"}
                </small>
            `;

        }


        console.error(
            "Firebase Registration Error:",
            err
        );


        button.disabled = false;
        button.textContent = "CREATE ACCOUNT";

    }

});

</script>

</body>
</html>
