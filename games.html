<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>Games - EXBT77 Play</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

:root{
  --bg:#080b10;
  --card:#11151d;
  --card-hover:#151a24;
  --border:rgba(255,255,255,.07);
  --border-light:rgba(255,255,255,.12);
  --text:#fff;
  --text-2:#89919f;
  --text-3:#6f7785;
  --accent:#8b5cf6;
  --accent-light:#a78bfa;
  --success:#42d38d;
  --warning:#e8b84d;
  --danger:#ff5c5c;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(139,92,246,.10),transparent 40%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:96px;
  overflow-x:hidden;
}

/* ============================================
   HEADER
============================================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,11,16,.88);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.3px;
}

.logo span{
  color:var(--accent);
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid var(--border);
  background:var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  cursor:pointer;
  transition:.18s;
}

.icon-btn:active{
  transform:scale(.92);
  background:var(--card-hover);
}

.icon-btn svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
}

/* ============================================
   CONTAINER
============================================= */

.container{
  padding:20px 16px 30px;
  max-width:900px;
  margin:0 auto;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:28px;
  font-weight:900;
  letter-spacing:-.6px;
  margin-bottom:6px;
}

.heading p{
  color:var(--text-2);
  font-size:13px;
  font-weight:500;
}

/* ============================================
   CATEGORY FILTER
============================================= */

.category{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:16px;
  scrollbar-width:none;
  margin-bottom:6px;
}

.category::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:none;
  padding:10px 18px;
  border-radius:30px;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text-2);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
  white-space:nowrap;
  user-select:none;
}

.cat:active{
  transform:scale(.95);
}

.cat.active{
  background:linear-gradient(135deg,#8b5cf6,#6d3dd6);
  color:#fff;
  border-color:transparent;
  box-shadow:0 6px 18px rgba(139,92,246,.35);
}

/* ============================================
   GAMES GRID
============================================= */

.games{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

@media(min-width:640px){
  .games{
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
}

@media(min-width:900px){
  .games{
    grid-template-columns:repeat(4,1fr);
  }
}

/* ============================================
   GAME CARD
============================================= */

.game{
  position:relative;
  overflow:hidden;
  min-height:210px;
  border-radius:20px;
  background:linear-gradient(145deg,#141923,#0e1118);
  border:1px solid var(--border);
  padding:17px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  display:flex;
  flex-direction:column;
  cursor:pointer;
  transition:transform .2s cubic-bezier(.4,0,.2,1),
             border-color .2s ease,
             box-shadow .2s ease;
  animation:cardIn .4s cubic-bezier(.4,0,.2,1) backwards;
}

.game:nth-child(1){animation-delay:.03s;}
.game:nth-child(2){animation-delay:.06s;}
.game:nth-child(3){animation-delay:.09s;}
.game:nth-child(4){animation-delay:.12s;}
.game:nth-child(5){animation-delay:.15s;}
.game:nth-child(6){animation-delay:.18s;}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.game:hover{
  border-color:var(--border-light);
  transform:translateY(-3px);
  box-shadow:0 18px 45px rgba(0,0,0,.4);
}

.game:active{
  transform:scale(.98);
}

.game::before{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-40px;
  top:-40px;
  background:rgba(139,92,246,.10);
  border-radius:50%;
  filter:blur(2px);
  transition:transform .3s ease;
  pointer-events:none;
}

.game:hover::before{
  transform:scale(1.15);
}

/* ============================================
   GAME IMAGE (if exists)
============================================= */

.game-image-wrap{
  position:relative;
  width:100%;
  height:100px;
  margin:-4px 0 12px;
  border-radius:14px;
  overflow:hidden;
  background:#0a0c11;
  border:1px solid rgba(255,255,255,.05);
}

.game-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .3s ease;
}

.game:hover .game-image{
  transform:scale(1.05);
}

/* ============================================
   GAME ICON
============================================= */

.game-icon{
  width:54px;
  height:54px;
  border-radius:16px;
  background:linear-gradient(145deg,#1d172c,#161a26);
  border:1px solid rgba(139,92,246,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  color:var(--accent-light);
  flex-shrink:0;
  position:relative;
  z-index:2;
}

.game-icon svg{
  width:26px;
  height:26px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

/* ============================================
   GAME INFO
============================================= */

.game-info{
  position:relative;
  z-index:2;
  flex:1;
  display:flex;
  flex-direction:column;
}

.game h3{
  font-size:15px;
  font-weight:750;
  letter-spacing:-.2px;
  margin-bottom:6px;
  color:#fff;
}

.game p{
  font-size:11px;
  color:var(--text-3);
  line-height:1.5;
  margin-bottom:12px;
  flex:1;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.game-fee{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:8px;
  background:rgba(139,92,246,.10);
  border:1px solid rgba(139,92,246,.18);
  color:var(--accent-light);
  font-size:10.5px;
  font-weight:700;
  margin-bottom:10px;
  align-self:flex-start;
}

.game-fee svg{
  width:11px;
  height:11px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.2;
}

/* ============================================
   PLAY BUTTON
============================================= */

.play{
  width:100%;
  height:40px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,#8b5cf6,#6d3dd6);
  color:#fff;
  font-size:12.5px;
  font-weight:800;
  cursor:pointer;
  letter-spacing:.2px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.18s;
  position:relative;
  z-index:2;
  box-shadow:0 4px 14px rgba(139,92,246,.28);
}

.play svg{
  width:13px;
  height:13px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.4;
}

.play:hover{
  box-shadow:0 6px 20px rgba(139,92,246,.45);
}

.play:active{
  transform:scale(.97);
}

/* ============================================
   BADGES
============================================= */

.badge{
  position:absolute;
  right:12px;
  top:12px;
  font-size:9px;
  font-weight:800;
  padding:5px 8px;
  border-radius:7px;
  letter-spacing:.5px;
  text-transform:uppercase;
  z-index:3;
}

.badge.live{
  background:rgba(66,211,141,.15);
  color:#42d38d;
  border:1px solid rgba(66,211,141,.25);
}

.badge.hot{
  background:rgba(255,92,92,.15);
  color:#ff7b7b;
  border:1px solid rgba(255,92,92,.25);
}

.badge.new{
  background:rgba(232,184,77,.15);
  color:#e8b84d;
  border:1px solid rgba(232,184,77,.25);
}

.badge.coming{
  background:rgba(139,148,158,.15);
  color:#9da5b2;
  border:1px solid rgba(139,148,158,.25);
}

/* ============================================
   LOADING SKELETON
============================================= */

.skeleton-card{
  min-height:210px;
  border-radius:20px;
  background:linear-gradient(90deg,#11151d 20%,#181d27 40%,#11151d 60%);
  background-size:300% 100%;
  animation:shimmer 1.4s infinite;
  border:1px solid var(--border);
}

@keyframes shimmer{
  0%{background-position:100% 0;}
  100%{background-position:-100% 0;}
}

/* ============================================
   EMPTY STATE
============================================= */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  border:1px dashed #272a35;
  border-radius:20px;
  background:#0d0e13;
}

.empty-icon{
  width:64px;
  height:64px;
  margin:0 auto 16px;
  border-radius:20px;
  background:#15171f;
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty-icon svg{
  width:28px;
  height:28px;
  stroke:#3d4453;
  fill:none;
  stroke-width:1.6;
}

.empty h3{
  font-size:16px;
  font-weight:800;
  color:#c4ccd8;
  margin-bottom:6px;
}

.empty p{
  font-size:12.5px;
  color:var(--text-3);
}

/* ============================================
   ERROR STATE
============================================= */

.error-state{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  border:1px dashed rgba(255,92,92,.25);
  border-radius:20px;
  background:rgba(30,15,20,.5);
}

.error-state .empty-icon svg{
  stroke:#ff7b7b;
}

.retry-btn{
  margin-top:16px;
  padding:10px 22px;
  border-radius:12px;
  border:1px solid rgba(139,92,246,.25);
  background:rgba(139,92,246,.10);
  color:var(--accent-light);
  font-size:12px;
  font-weight:750;
  cursor:pointer;
  transition:.18s;
}

.retry-btn:active{
  transform:scale(.96);
}

/* ============================================
   NOTICE
============================================= */

.notice{
  margin-top:20px;
  padding:15px;
  border-radius:16px;
  background:#10151d;
  border:1px solid var(--border);
  color:var(--text-3);
  font-size:11px;
  line-height:1.6;
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.notice svg{
  width:15px;
  height:15px;
  stroke:var(--accent-light);
  fill:none;
  stroke-width:2;
  flex-shrink:0;
  margin-top:1px;
}

/* ============================================
   BOTTOM NAV
============================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  z-index:40;
  background:rgba(10,13,19,.94);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 7px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.nav-item{
  text-decoration:none;
  color:var(--text-3);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:10px;
  font-weight:600;
  cursor:pointer;
  transition:.18s;
  border-radius:14px;
}

.nav-item:active{
  background:rgba(255,255,255,.05);
}

.nav-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

.nav-item.active{
  color:var(--accent-light);
}

/* ============================================
   TOAST
============================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%) translateY(20px);
  background:#191b24;
  border:1px solid #2a2d39;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  max-width:85%;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  gap:9px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast svg{
  width:15px;
  height:15px;
  stroke:var(--accent-light);
  fill:none;
  stroke-width:2.2;
  flex-shrink:0;
}

/* ============================================
   RESPONSIVE
============================================= */

@media(max-width:360px){
  .games{
    gap:10px;
  }

  .game{
    padding:14px;
    min-height:190px;
  }

  .heading h1{
    font-size:24px;
  }

  .game h3{
    font-size:14px;
  }

  .game p{
    font-size:10.5px;
  }
}

</style>
</head>

function escapeHTML(v){
  if(v === undefined || v === null) return "";
  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

    <rect x="3" y="6" width="18" height="12" rx="5"/>
    <path d="M8 12h4M10 10v4"/>
    <circle cx="16" cy="11" r=".7" fill="currentColor" stroke="none"/>
    <circle cx="18" cy="13" r=".7" fill="currentColor" stroke="none"/>
  `
};


function getGameIcon(slug){
  return GAME_ICONS[slug] || GAME_ICONS["default"];
}


/* =====================================================
   GET BADGE
===================================================== */

function getBadge(game){

  if(game.badge){
    const cls = escapeHTML(game.badge.toLowerCase());
    return `<span class="badge ${cls}">${escapeHTML(game.badge)}</span>`;
  }

  if(game.status === "coming_soon"){
    return `<span class="badge coming">Soon</span>`;
  }

  if(game.featured === true){
    return `<span class="badge hot">Hot</span>`;
  }

  return `<span class="badge live">Live</span>`;

}


/* =====================================================
   LOAD GAMES FROM FIREBASE
===================================================== */

async function loadGames(){

  try{

    const snap = await get(ref(db, "games"));

    if(!snap.exists()){
      renderEmpty();
      return;
    }

    allGames = [];

    snap.forEach(child => {
      const data = child.val() || {};
      allGames.push({
        slug: child.key,
        ...data
      });
    });

    /* Filter: শুধু active games */
    allGames = allGames.filter(g => g.status !== "disabled");

    /* Sort: order → name */
    allGames.sort((a,b) => {
      const orderA = Number(a.order || 999);
      const orderB = Number(b.order || 999);
      if(orderA !== orderB) return orderA - orderB;
      return (a.name || "").localeCompare(b.name || "");
    });

    buildCategories();
    renderGames();

  }catch(err){

    console.error("Load games error:", err);
    renderError(err.message);

  }

}


/* =====================================================
   BUILD CATEGORIES
===================================================== */

function buildCategories(){

  /* Get unique categories */
  const categories = new Set();

  allGames.forEach(g => {
    if(g.category && g.category !== "All Games"){
      categories.add(g.category);
    }
  });

  /* Build HTML */
  let html = `<div class="cat ${currentCategory === "All Games" ? "active" : ""}"
                   data-cat="All Games"
                   onclick="selectCategory('All Games')">All Games</div>`;

  Array.from(categories).sort().forEach(cat => {
    html += `<div class="cat ${currentCategory === cat ? "active" : ""}"
                  data-cat="${escapeHTML(cat)}"
                  onclick="selectCategory('${escapeHTML(cat)}')">${escapeHTML(cat)}</div>`;
  });

  categoryBar.innerHTML = html;

}


/* =====================================================
   SELECT CATEGORY
===================================================== */

window.selectCategory = function(cat){

  currentCategory = cat;

  categoryBar.querySelectorAll(".cat").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === cat);
  });

  renderGames();

};


/* =====================================================
   RENDER GAMES
===================================================== */

function renderGames(){

  const filtered = currentCategory === "All Games"
    ? allGames
    : allGames.filter(g => g.category === currentCategory);

  if(filtered.length === 0){
    renderEmpty();
    return;
  }

  gamesGrid.innerHTML = "";

  filtered.forEach(game => {

    const card = document.createElement("div");
    card.className = "game";
    card.setAttribute("data-cat", game.category || "");

    /* Image or Icon */
    const imageHtml = game.thumbnail
      ? `
        <div class="game-image-wrap">
          <img class="game-image"
               src="${escapeHTML(game.thumbnail)}"
               alt="${escapeHTML(game.name || '')}"
               loading="lazy"
               onerror="this.style.display='none';this.parentElement.style.display='none';">
        </div>
      `
      : `<div class="game-icon">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
             ${getGameIcon(game.slug)}
           </svg>
         </div>`;

    /* Entry fee */
    const feeHtml = game.entryFee
      ? `<div class="game-fee">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
             <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
           </svg>
           Entry ৳${Number(game.entryFee)}
         </div>`
      : "";

    /* Play button (disabled if coming soon) */
    const isComingSoon = game.status === "coming_soon";
    const buttonDisabled = isComingSoon ? "disabled" : "";
    const buttonStyle = isComingSoon
      ? `style="background:rgba(255,255,255,.06);color:#6f7785;box-shadow:none;cursor:not-allowed;"` : "";

    card.innerHTML = `

      ${getBadge(game)}

      ${imageHtml}

      <div class="game-info">

        <h3>${escapeHTML(game.name || "Untitled Game")}</h3>

        <p>${escapeHTML(game.description || "Play and win rewards.")}</p>

        ${feeHtml}

      </div>

      <button class="play" ${buttonDisabled} ${buttonStyle}
              onclick="event.stopPropagation();playGame('${escapeHTML(game.slug)}','${escapeHTML(game.gameUrl || '')}', ${isComingSoon})">

        ${isComingSoon
          ? `Coming Soon`
          : `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
               <path d="M8 5v14l11-7z"/>
             </svg>
             Play Now`
        }

      </button>

    `;

    /* Click on card = play */
    if(!isComingSoon){
      card.addEventListener("click", () => {
        playGame(game.slug, game.gameUrl, false);
      });
    }

    gamesGrid.appendChild(card);

  });

}


/* =====================================================
   PLAY GAME
===================================================== */

window.playGame = function(slug, gameUrl, isComingSoon){

  if(isComingSoon){
    showToast("This game is coming soon!");
    return;
  }

  if(!gameUrl){
    showToast("Game link not configured yet");
    return;
  }

  /* Navigate to game */
  location.href = gameUrl;

};


/* =====================================================
   EMPTY STATE
===================================================== */

function renderEmpty(){

  gamesGrid.innerHTML = `
    <div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <path d="M8 12h4M10 10v4"/>
          <circle cx="16" cy="11" r=".7" fill="currentColor" stroke="none"/>
          <circle cx="18" cy="13" r=".7" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h3>No Games Available</h3>
      <p>Games will appear here once added by admin</p>
    </div>
  `;

}


/* =====================================================
   ERROR STATE
===================================================== */

function renderError(msg){

  gamesGrid.innerHTML = `
    <div class="error-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
      </div>
      <h3 style="color:#c4ccd8;margin-bottom:6px;">Unable to Load</h3>
      <p style="color:#6f7785;font-size:12.5px;">${escapeHTML(msg || "Please try again")}</p>
      <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
  `;

}


/* =====================================================
   AUTH GUARD
===================================================== */

onAuthStateChanged(auth, user => {

  if(!user){
    location.replace("login.html");
    return;
  }

  loadGames();

});

</script>
